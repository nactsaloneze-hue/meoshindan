<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サロンのオンライン集客チェック</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --neon:#00d4ff;
    --neon2:#7b2fff;
    --gold:#c9a84c;
    --bg:#000;
    --white:#f0f0f0;
    --gray:#aaa;
  }
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ===== SCREENS ===== */
  .screen{
    display:none;
    min-height:100vh;
    padding:40px 24px;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .screen.active{display:flex;}

  /* ===== TOP ===== */
  #top{text-align:center;gap:32px;}
  .top-img{
    width:min(320px,80vw);
    height:min(320px,80vw);
    object-fit:cover;
    border:2px solid var(--gold);
    display:block;
    margin:0 auto;
  }
  .top-img-placeholder{
    width:min(320px,80vw);
    height:min(320px,80vw);
    border:2px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-size:14px;
    background:#0a0a0a;
  }
  .top-title{
    font-size:clamp(22px,5vw,36px);
    font-weight:900;
    letter-spacing:.05em;
    line-height:1.4;
  }
  .top-title span{color:var(--neon);}
  .top-sub{
    font-size:clamp(13px,3vw,17px);
    color:var(--gray);
    line-height:1.8;
  }
  .start-btn{
    margin-top:8px;
    padding:20px 48px;
    border:2px solid var(--neon);
    background:transparent;
    color:var(--neon);
    font-size:clamp(16px,4vw,22px);
    font-weight:700;
    letter-spacing:.1em;
    cursor:pointer;
    border-radius:4px;
    transition:all .3s;
    font-family:inherit;
  }
  .start-btn:hover{
    background:rgba(0,212,255,.1);
    box-shadow:0 0 20px var(--neon),0 0 40px rgba(0,212,255,.3);
  }
  .start-btn:active{
    transform:scale(.97);
    box-shadow:0 0 30px var(--neon),0 0 60px var(--neon);
  }

  /* ===== QUIZ ===== */
  #quiz{gap:0;}
  .quiz-inner{
    width:100%;
    max-width:640px;
    animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:translateY(0);}
  }
  .progress-bar{
    width:100%;
    height:4px;
    background:#222;
    border-radius:2px;
    margin-bottom:36px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--neon),var(--neon2));
    border-radius:2px;
    transition:width .5s ease;
  }
  .q-num{
    font-size:13px;
    color:var(--gold);
    letter-spacing:.15em;
    margin-bottom:12px;
    font-weight:700;
  }
  .q-text{
    font-size:clamp(17px,4vw,24px);
    font-weight:700;
    line-height:1.6;
    margin-bottom:36px;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .choice-btn{
    padding:20px 24px;
    border:1.5px solid #444;
    background:transparent;
    color:var(--white);
    font-size:clamp(14px,3.5vw,17px);
    font-family:inherit;
    text-align:left;
    cursor:pointer;
    border-radius:6px;
    line-height:1.6;
    transition:all .25s;
    position:relative;
    overflow:hidden;
  }
  .choice-btn::before{
    content:'';
    position:absolute;
    inset:0;
    background:var(--neon);
    opacity:0;
    transition:opacity .2s;
    pointer-events:none;
  }
  .choice-btn:hover{
    border-color:var(--neon);
    box-shadow:0 0 12px rgba(0,212,255,.3);
  }
  .choice-btn.flash{
    border-color:var(--neon);
    box-shadow:0 0 24px var(--neon),0 0 48px rgba(0,212,255,.4);
    background:rgba(0,212,255,.08);
  }
  .choice-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.1em;
    padding:2px 8px;
    border-radius:3px;
    margin-right:10px;
    vertical-align:middle;
  }
  .tag-a,
  .tag-b,
  .tag-c{
    background:#5a5a5a;
    color:#fff;
    border:1px solid #7a7a7a;
  }

  /* ===== POINT HINT ===== */
  .hint-box{
    margin-top:28px;
    padding:20px 24px;
    border-left:3px solid var(--gold);
    background:rgba(201,168,76,.06);
    border-radius:0 6px 6px 0;
    font-size:clamp(14px,3.5vw,17px);
    line-height:1.8;
    color:#e8d5a3;
    animation:fadeIn .4s ease;
  }
  .hint-label{
    font-size:12px;
    color:var(--gold);
    letter-spacing:.15em;
    font-weight:700;
    margin-bottom:8px;
  }

  /* ===== RESULT ===== */
  #result{gap:28px;text-align:center;}
  .result-inner{
    width:100%;
    max-width:600px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    animation:fadeIn .6s ease;
  }
  .result-img{
    width:min(280px,75vw);
    height:min(280px,75vw);
    object-fit:cover;
    border:2px solid var(--gold);
    display:block;
  }
  .result-img-placeholder{
    width:min(280px,75vw);
    height:min(280px,75vw);
    border:2px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-size:13px;
    background:#0a0a0a;
  }
  .result-rank{
    font-size:clamp(48px,12vw,80px);
    font-weight:900;
    line-height:1;
    background:linear-gradient(135deg,var(--neon),var(--neon2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .result-score{
    font-size:clamp(14px,3vw,18px);
    color:var(--gray);
    margin-top:-8px;
  }
  .result-title{
    font-size:clamp(20px,5vw,30px);
    font-weight:900;
    color:var(--gold);
    letter-spacing:.05em;
    border:1.5px solid var(--gold);
    padding:12px 28px;
    border-radius:4px;
  }
  .result-msg{
    font-size:clamp(15px,3.5vw,18px);
    line-height:1.9;
    color:var(--white);
    text-align:left;
    background:#0a0a0a;
    border:1px solid #222;
    padding:24px;
    border-radius:8px;
    width:100%;
  }
  .result-msg strong{color:var(--neon);}
  .result-note{
    width:100%;
    color:var(--gray);
    font-size:14px;
    line-height:1.7;
  }
  .priority-box{
    width:100%;
    text-align:left;
    padding:20px 24px;
    border:1px solid var(--gold);
    border-radius:8px;
    line-height:1.7;
  }
  .priority-box strong{color:var(--gold);display:block;margin-bottom:6px;}
  .line-cta{
    width:100%;
    background:#06C755;
    border:none;
    border-radius:8px;
    padding:24px 20px;
    cursor:pointer;
    text-decoration:none;
    display:block;
    transition:all .3s;
  }
  .line-cta:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 32px rgba(6,199,85,.4);
  }
  .line-cta-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .line-cta-label{
    font-size:13px;
    color:rgba(255,255,255,.85);
    letter-spacing:.05em;
  }
  .line-cta-main{
    font-size:clamp(16px,4vw,22px);
    font-weight:900;
    color:#fff;
    line-height:1.4;
    text-align:center;
  }
  .line-cta-sub{
    font-size:12px;
    color:rgba(255,255,255,.7);
  }
  .retry-btn{
    padding:16px 40px;
    border:1.5px solid #444;
    background:transparent;
    color:var(--gray);
    font-size:15px;
    font-family:inherit;
    cursor:pointer;
    border-radius:4px;
    transition:all .3s;
    letter-spacing:.05em;
  }
  .retry-btn:hover{
    border-color:#666;
    color:var(--white);
  }

  b{font-weight:700;}
</style>
</head>
<body>

<!-- TOP -->
<div id="top" class="screen active">
  <div id="top-img-wrap">
    <img src="top.png" class="top-img" alt="診断トップ画像">

  </div>
  <div class="top-title">あなたのサロンの<br><span>見つけやすさと予約のしやすさをチェック</span></div>
  <div class="top-sub">全12問・約3分｜オンライン集客の自己点検<br>回答を点数化した目安です。検索順位や売上を測定するものではありません。</div>
  <button class="start-btn" onclick="startQuiz()">診断スタート →</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="quiz-inner" id="quiz-inner"></div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="result-inner" id="result-inner"></div>
</div>

<script>
const questions = [
  {
    num:1,
    text:'Googleビジネスプロフィールを管理し、店舗の基本情報を確認していますか？',
    hint:'オーナー確認を行い、営業時間・連絡先・所在地などを最新に保つと、お客様が安心して来店を検討できます。',
    action:'Googleビジネスプロフィールのオーナー確認と基本情報を確認する',
    choices:[
      {tag:'A',text:'オーナー確認済みで、基本情報も定期的に見直している。',pt:10},
      {tag:'B',text:'プロフィールはあるが、情報の確認が不定期。',pt:5},
      {tag:'C',text:'プロフィールの管理状況が分からない、または未設定。',pt:0},
    ]
  },
  {
    num:2,
    text:'提供している施術やサービスは、店舗情報で分かりやすく伝わりますか？',
    hint:'実際のメニューに合うカテゴリやサービス説明を使い、初めてのお客様にも内容が伝わるようにしましょう。',
    action:'カテゴリ・サービス・メニューの説明を実際の提供内容に合わせる',
    choices:[
      {tag:'A',text:'カテゴリとサービス内容が実態に合い、料金や特徴も分かる。',pt:10},
      {tag:'B',text:'主なサービスは載せているが、説明や料金に不足がある。',pt:5},
      {tag:'C',text:'提供内容が古い、または何を受けられるか分かりにくい。',pt:0},
    ]
  },
  {
    num:3,
    text:'営業時間・住所・連絡先は、Googleマップや予約ページで正確ですか？',
    hint:'表記を一文字単位でそろえることより、来店や予約に必要な情報が正確であることを優先しましょう。臨時休業や移転時の更新も大切です。',
    action:'営業時間・住所・電話番号と臨時変更の案内を確認する',
    choices:[
      {tag:'A',text:'主要な掲載先で確認し、変更があれば更新している。',pt:10},
      {tag:'B',text:'おおむね正しいが、最近は見直していない。',pt:5},
      {tag:'C',text:'掲載先によって情報が違う、または確認していない。',pt:0},
    ]
  },
  {
    num:4,
    text:'店内や施術内容が伝わる、実際の写真を掲載していますか？',
    hint:'外観・店内・設備・サービスの写真は、来店前の不安を減らす材料になります。人物を写す場合は掲載許可も確認しましょう。',
    action:'来店前に知りたい外観・店内・サービスの写真を見直す',
    choices:[
      {tag:'A',text:'実際の雰囲気が分かる写真を掲載し、変化に合わせて更新している。',pt:10},
      {tag:'B',text:'写真はあるが、現在の店内やサービスと少し違う。',pt:5},
      {tag:'C',text:'写真が少ない、または実際の様子が伝わらない。',pt:0},
    ]
  },
  {
    num:5,
    text:'お客様の口コミに、内容を踏まえて丁寧に返信していますか？',
    hint:'返信は次のお客様にも見られます。感謝を伝え、個人情報や施術の詳細を公開しすぎないことが大切です。検索順位への効果は保証できません。',
    action:'口コミへの返信方法とプライバシーへの配慮を確認する',
    choices:[
      {tag:'A',text:'口コミを確認し、内容に合わせて丁寧に返信している。',pt:10},
      {tag:'B',text:'確認しているが、返信できていないものがある。',pt:5},
      {tag:'C',text:'口コミをほとんど確認していない。',pt:0},
    ]
  },
  {
    num:6,
    text:'休業日や新メニューなど、お客様に必要な変更を伝えていますか？',
    hint:'Googleビジネスプロフィールの投稿は、最新情報やお知らせを届ける手段です。週に何回投稿すれば順位が上がる、という決まりはありません。',
    action:'休業日・新メニュー・キャンペーンなどの案内を最新にする',
    choices:[
      {tag:'A',text:'変更があれば、プロフィールや予約ページで案内している。',pt:10},
      {tag:'B',text:'案内しているが、掲載先によって古い情報が残ることがある。',pt:5},
      {tag:'C',text:'変更があってもオンラインでは案内していない。',pt:0},
    ]
  },
  {
    num:7,
    text:'初めてのお客様が、料金と予約方法を迷わず確認できますか？',
    hint:'ホームページの有無だけで評価するのではなく、実際に使っている予約ページも含めて、メニュー・料金・予約手順の分かりやすさを確認します。',
    action:'メニュー・料金・予約方法を一つの流れで確認できるようにする',
    choices:[
      {tag:'A',text:'主なメニュー・料金・予約方法が分かりやすく載っている。',pt:10},
      {tag:'B',text:'情報はあるが、複数ページを探さないと分からない。',pt:5},
      {tag:'C',text:'料金や予約方法が分かりにくい、または古い。',pt:0},
    ]
  },
  {
    num:8,
    text:'スマホで店舗情報を見て、予約まで進めるか確認していますか？',
    hint:'読み込みや操作のしやすさは、お客様の体験に関わります。「3秒を超えると必ず順位が下がる」といった一律の判断はしません。',
    action:'スマホで店舗情報から予約完了までの操作を試す',
    choices:[
      {tag:'A',text:'スマホで表示と予約の流れを試し、問題があれば直している。',pt:10},
      {tag:'B',text:'表示は確認したが、予約完了までは試していない。',pt:5},
      {tag:'C',text:'スマホでの見え方や予約の流れを確認していない。',pt:0},
    ]
  },
  {
    num:9,
    text:'地域とサービスの情報を、お客様に自然な言葉で説明していますか？',
    hint:'所在地や対応する施術を具体的に書くと、お客様が自分に合うか判断しやすくなります。同じ地名や施術名の繰り返しは不要です。',
    action:'所在地・対象のお客様・サービス内容を自然な文章で伝える',
    choices:[
      {tag:'A',text:'地域とサービス内容を、実態に沿って具体的に説明している。',pt:10},
      {tag:'B',text:'雰囲気は伝わるが、場所やサービスの説明に不足がある。',pt:5},
      {tag:'C',text:'どこで何を提供しているか分かりにくい。',pt:0},
    ]
  },
  {
    num:10,
    text:'Googleマップ・ホームページ・SNSなどの案内は、互いにつながっていますか？',
    hint:'お客様が見つけた場所から予約先へ進めることが大切です。SNSやホームページの役割は、サロンの客層に合わせて考えましょう。',
    action:'各掲載先から予約先へのリンクと案内を確認する',
    choices:[
      {tag:'A',text:'主要な掲載先から予約先に迷わず進める。',pt:10},
      {tag:'B',text:'一部の掲載先では予約先が分かりにくい。',pt:5},
      {tag:'C',text:'掲載先から予約へのつながりを確認していない。',pt:0},
    ]
  },
  {
    num:11,
    text:'新規のお客様がどこでサロンを知ったか、把握していますか？',
    hint:'検索での表示回数だけでなく、問い合わせや予約につながった経路を確認すると、優先すべき改善を考えやすくなります。',
    action:'新規予約のきっかけを無理のない方法で記録する',
    choices:[
      {tag:'A',text:'予約時の確認などで、主な流入経路を把握している。',pt:10},
      {tag:'B',text:'感覚的には分かるが、記録はしていない。',pt:5},
      {tag:'C',text:'どの経路から新規予約が来るか分からない。',pt:0},
    ]
  },
  {
    num:12,
    text:'掲載情報と予約状況を見直し、次の改善を決めていますか？',
    hint:'プロフィールや予約ページを整えても、集客や検索順位は自動的には保証されません。実際の問い合わせや予約を見て改善を続けましょう。',
    action:'問い合わせ・予約状況を見て、次に直す点を一つ決める',
    choices:[
      {tag:'A',text:'情報と予約状況を見直し、改善点を決めている。',pt:10},
      {tag:'B',text:'気づいたときに直すが、振り返りは不定期。',pt:5},
      {tag:'C',text:'掲載後はほとんど見直していない。',pt:0},
    ]
  },
];

const ranks = [
  {min:110,max:120,rank:'S',img:'rank_s.png',title:'基本情報と予約導線が整っています',
   msg:'回答では、多くの項目が整っています。実際の問い合わせ・予約状況も確認し、必要な更新を続けましょう。'},
  {min:90,max:109,rank:'A',img:'rank_a.png',title:'良い土台があります',
   msg:'回答では、店舗情報や予約への案内が概ね整っています。点数が低かった項目から一つずつ確認しましょう。'},
  {min:60,max:89,rank:'B',img:'rank_b.png',title:'改善できる項目があります',
   msg:'回答では、基本情報や予約への流れに見直しの余地があります。まずはお客様が困りやすい箇所を確認しましょう。'},
  {min:30,max:59,rank:'C',img:'rank_c.png',title:'基本情報から見直しましょう',
   msg:'回答では、店舗情報や予約方法が伝わりにくい可能性があります。営業時間・連絡先・メニューから確認しましょう。'},
  {min:0,max:29,rank:'D',img:'rank_d.png',title:'まずは掲載状況を確認しましょう',
   msg:'回答では、オンライン上の案内に未確認の項目が多くあります。Googleビジネスプロフィールと予約先の情報から確かめましょう。'},
];

let cur=0, scores=[];

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById(id);
  if(el) el.classList.add('active');
}

function startQuiz(){
  cur=0; scores=[];
  showScreen('quiz');
  renderQ();
}

function renderQ(){
  const q=questions[cur];
  const pct=Math.round((cur/questions.length)*100);
  const html=`
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-num">QUESTION ${String(q.num).padStart(2,'0')} / ${questions.length}</div>
    <div class="q-text">${q.text}</div>
    <div class="choices">
      ${q.choices.map((c,i)=>`
        <button class="choice-btn" onclick="answer(${c.pt},this,${i})" id="cb${i}">
          <span class="choice-tag tag-${c.tag.toLowerCase()}">${c.tag}</span>${c.text}
        </button>
      `).join('')}
    </div>
    <div id="hint-area"></div>
  `;
  const inner=document.getElementById('quiz-inner');
  inner.innerHTML=html;
  inner.style.animation='none';
  void inner.offsetWidth;
  inner.style.animation='fadeIn .5s ease';
}

function answer(pt, btn, idx){
  const q=questions[cur];
  scores.push(pt);
  document.querySelectorAll('.choice-btn').forEach(b=>{b.disabled=true;b.style.opacity='.4';});
  btn.style.opacity='1';
  btn.classList.add('flash');
  btn.blur();
  const hintArea=document.getElementById('hint-area');
  hintArea.innerHTML=`<div class="hint-box"><div class="hint-label">💡 プロのワンポイント解説</div>${q.hint}</div>`;
  setTimeout(()=>{
    cur++;
    if(cur>=questions.length) showResult();
    else renderQ();
  },1800);
}

function showResult(){
  const total=scores.reduce((a,b)=>a+b,0);
  const rank=ranks.find(r=>total>=r.min && total<=r.max) || ranks[ranks.length-1];
  const lowestScore=Math.min(...scores);
  const priorityIndex=scores.findIndex(score=>score===lowestScore);
  const priority=lowestScore===10
    ? '現在の情報と実際の問い合わせ・予約状況を照らして、改善を続ける'
    : questions[priorityIndex].action;
  const inner=document.getElementById('result-inner');
  inner.innerHTML=`
    <div class="result-rank">RANK ${rank.rank}</div>
    <div class="result-score">スコア：${total} / 120点</div>
    <img src="${rank.img}" class="result-img" alt="${rank.title}">

    <div class="result-title">${rank.title}</div>
    <div class="result-msg">${rank.msg}</div>
    <div class="priority-box"><strong>回答から、まず確認したいこと</strong>${priority}</div>
    <div class="result-note">この点数は回答に基づく自己点検の目安です。実際の検索順位、AI検索での表示、予約数を測定した結果ではありません。</div>
    <a href="https://lin.ee/woRCsiS" target="_blank" rel="noopener" class="line-cta">
      <div class="line-cta-inner">
        <div class="line-cta-label">サロン集客の情報をもっと知りたい方へ</div>
        <div class="line-cta-main">LINEで資料の案内を見る →</div>
        <div class="line-cta-sub">提供内容はリンク先でご確認ください</div>
      </div>
    </a>
    <button class="retry-btn" onclick="startQuiz()">もう一度診断する</button>
  `;
  showScreen('result');
}
</script>

</body>
</html>
